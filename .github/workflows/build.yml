name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Finds settings.gradle wherever it is. If you accidentally uploaded the
      # project as a .zip, this unpacks it first so the build still works.
      - name: Find the project
        id: locate
        shell: bash
        run: |
          set -e
          find_settings() { find . -name settings.gradle -not -path './.git/*' | head -n 1; }
          SETTINGS="$(find_settings)"
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle yet - looking for a zip to unpack..."
            for z in $(find . -maxdepth 3 -name '*.zip' -not -path './.git/*'); do
              echo "Unpacking $z"
              unzip -o -q "$z" -d "_unzipped_$(basename "$z" .zip)"
            done
            SETTINGS="$(find_settings)"
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle found. Upload the CONTENTS of the project (not the .zip itself) to the repo root."
            ls -la
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Collect jar
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          mkdir -p dist
          JAR="$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-slim' | head -n 1)"
          cp "$JAR" dist/tooperfect.jar
          ls -la dist

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tooperfect-jar
          path: ${{ steps.locate.outputs.dir }}/dist/tooperfect.jar
